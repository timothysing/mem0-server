name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    # Scope enforcement is a security boundary (Phyllis's key must never read Herbie's
    # rows), so the image is not built unless every denied path is still denied.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest starlette httpx
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned upstream SHA
        id: pin
        run: echo "sha=$(tr -d ' \n' < MEM0_SHA)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MEM0_SHA=${{ steps.pin.outputs.sha }}
          tags: |
            ghcr.io/timothysing/mem0-server:${{ github.sha }}
            ghcr.io/timothysing/mem0-server:mem0-${{ steps.pin.outputs.sha }}
